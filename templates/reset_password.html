{% extends 'base.html' %}
{% block title %}Reset Password - CarePoint HMS{% endblock %}

{% block login_content %}
<div class="login-bg">
  <div class="card login-card p-4 bg-white shadow-lg">
    <div class="text-center mb-4">
      <div class="display-6 text-primary fw-bold text-teal">
        <i class="fa-solid fa-lock-open me-2 text-turquoise"></i>CarePoint
      </div>
      <h5 class="fw-bold text-dark mt-2 m-0">Set New Password</h5>
      <p class="text-muted small mt-1">Enter and confirm your new account password below.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">New Password *</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-secondary"></i></span>
          <input type="password" class="form-control password-input" id="password" name="password" placeholder="Min 6 characters" required autofocus>
          <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="password">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
        <div class="progress mt-2" style="height: 5px;">
          <div class="progress-bar password-meter" role="progressbar" style="width: 0%;"></div>
        </div>
      </div>

      <div class="mb-4">
        <label for="confirm_password" class="form-label fw-semibold">Confirm New Password *</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="fa-solid fa-check-double text-secondary"></i></span>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required>
          <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="confirm_password">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-teal w-100 py-2 fw-semibold shadow-sm mb-3">
        <i class="fa-solid fa-shield-halved me-2"></i> Reset Password
      </button>

      <div class="text-center">
        <a href="{{ url_for('auth.login') }}" class="small text-secondary text-decoration-none">
          <i class="fa-solid fa-arrow-left me-1"></i> Cancel & Return to Sign In
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
