{% extends 'base.html' %}
{% block title %}Sign In - CarePoint HMS{% endblock %}

{% block login_content %}
<div class="login-bg">
  <div class="card login-card p-4 bg-white shadow-lg">
    <div class="text-center mb-4">
      <div class="display-6 text-primary fw-bold text-teal">
        <i class="fa-solid fa-hospital-user me-2 text-turquoise"></i>CarePoint
      </div>
      <p class="text-muted small m-0">Hospital Management System</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="mb-3">
        <label for="username" class="form-label fw-semibold">Username or Email</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="fa-solid fa-user text-secondary"></i></span>
          <input type="text" class="form-control" id="username" name="username" placeholder="admin or admin@carepoint.org" required autofocus>
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="password" class="form-label fw-semibold m-0">Password</label>
          <a href="{{ url_for('auth.forgot_password') }}" class="small text-teal text-decoration-none">Forgot Password?</a>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-secondary"></i></span>
          <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
          <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="password">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="mb-4 form-check d-flex justify-content-between align-items-center">
        <div>
          <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me" value="true">
          <label class="form-check-label small text-secondary" for="remember_me">Remember Me</label>
        </div>
      </div>

      <button type="submit" class="btn btn-teal w-100 py-2 fw-semibold shadow-sm mb-3">
        <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
      </button>

      <div class="text-center mb-3">
        <span class="small text-muted">Don't have an account? </span>
        <a href="{{ url_for('auth.signup') }}" class="small fw-bold text-teal text-decoration-none">Create Account (Sign Up)</a>
      </div>

      <div class="p-3 bg-light rounded border text-center small text-secondary">
        <strong class="d-block mb-1 text-dark"><i class="fa-solid fa-key me-1"></i> Fictional Demo Logins:</strong>
        <div class="d-flex justify-content-around mt-2">
          <span><code>admin</code> / <code>admin123</code></span>
          <span><code>receptionist</code> / <code>reception123</code></span>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
