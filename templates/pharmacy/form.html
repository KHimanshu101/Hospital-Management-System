{% extends 'base.html' %}
{% block title %}Add Medicine Stock - CarePoint HMS{% endblock %}
{% block page_title %}Register Medicine Inventory Item{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card card-table p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold text-teal m-0">New Medicine Inventory Entry</h5>
        <a href="{{ url_for('pharmacy.list_medicines') }}" class="btn btn-sm btn-outline-secondary">&larr; Back to Inventory</a>
      </div>

      <form method="POST" action="">
        <div class="row g-3 mb-3">
          <div class="col-md-7">
            <label for="name" class="form-label fw-semibold">Medicine Brand / Generic Name *</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Amoxicillin 500mg" value="{{ medicine.name if medicine else '' }}" required>
          </div>
          <div class="col-md-5">
            <label for="batch_number" class="form-label fw-semibold">Batch Number *</label>
            <input type="text" class="form-control" id="batch_number" name="batch_number" placeholder="e.g. AMX-2026-01" value="{{ medicine.batch_number if medicine else '' }}" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label for="quantity" class="form-label fw-semibold">Initial Stock Quantity *</label>
            <input type="number" class="form-control" id="quantity" name="quantity" value="{{ medicine.quantity if medicine else '100' }}" min="0" required>
          </div>
          <div class="col-md-4">
            <label for="unit_price" class="form-label fw-semibold">Unit Selling Price ($) *</label>
            <input type="number" step="0.01" class="form-control" id="unit_price" name="unit_price" value="{{ medicine.unit_price if medicine else '10.00' }}" min="0" required>
          </div>
          <div class="col-md-4">
            <label for="reorder_level" class="form-label fw-semibold">Reorder Threshold *</label>
            <input type="number" class="form-control" id="reorder_level" name="reorder_level" value="{{ medicine.reorder_level if medicine else '10' }}" min="0" required>
          </div>
        </div>

        <div class="mb-4">
          <label for="expiry_date" class="form-label fw-semibold">Expiration Date *</label>
          <input type="date" class="form-control" id="expiry_date" name="expiry_date" value="{{ medicine.expiry_date if medicine else '' }}" required>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a href="{{ url_for('pharmacy.list_medicines') }}" class="btn btn-light border">Cancel</a>
          <button type="submit" class="btn btn-teal px-4 fw-semibold">Add Medicine</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
