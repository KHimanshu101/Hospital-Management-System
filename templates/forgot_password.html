{% extends 'base.html' %}
{% block title %}Forgot Password - CarePoint HMS{% endblock %}

{% block login_content %}
<div class="login-bg">
  <div class="card login-card p-4 bg-white shadow-lg">
    <div class="text-center mb-4">
      <div class="display-6 text-primary fw-bold text-teal">
        <i class="fa-solid fa-key me-2 text-turquoise"></i>CarePoint
      </div>
      <h5 class="fw-bold text-dark mt-2 m-0">Reset Password Request</h5>
      <p class="text-muted small mt-1">Enter your registered email address to receive password recovery instructions.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <div class="mb-4">
        <label for="email" class="form-label fw-semibold">Registered Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-secondary"></i></span>
          <input type="email" class="form-control" id="email" name="email" placeholder="name@carepoint.org" required autofocus>
        </div>
      </div>

      <button type="submit" class="btn btn-teal w-100 py-2 fw-semibold shadow-sm mb-3">
        <i class="fa-solid fa-paper-plane me-2"></i> Send Password Reset Link
      </button>

      <div class="text-center">
        <a href="{{ url_for('auth.login') }}" class="small text-secondary text-decoration-none">
          <i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
