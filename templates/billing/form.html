{% extends 'base.html' %}
{% block title %}Create Invoice - CarePoint HMS{% endblock %}
{% block page_title %}Generate New Patient Invoice{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card card-table p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold text-teal m-0">Create Invoice Container</h5>
        <a href="{{ url_for('billing.list_bills') }}" class="btn btn-sm btn-outline-secondary">&larr; Back to Ledger</a>
      </div>

      <form method="POST" action="">
        <div class="mb-4">
          <label for="patient_id" class="form-label fw-semibold">Select Patient *</label>
          <select class="form-select" id="patient_id" name="patient_id" required>
            <option value="">Choose Patient...</option>
            {% for p in patients %}
            <option value="{{ p.id }}">{{ p.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a href="{{ url_for('billing.list_bills') }}" class="btn btn-light border">Cancel</a>
          <button type="submit" class="btn btn-teal px-4 fw-semibold"><i class="fa-solid fa-plus me-1"></i> Generate Invoice Container</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
